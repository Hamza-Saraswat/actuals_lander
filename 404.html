<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Actuals</title>
<meta name="theme-color" content="#0b0c0e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0c0e'/%3E%3Cpath d='M7 17.5l5.5 5.5L25 10' stroke='%23f08a3c' stroke-width='3.5' fill='none'/%3E%3C/svg%3E">
<script>
/* set theme before first paint so there is no flash */
(function(){try{var t=localStorage.getItem('actuals-theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';}document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<style>
/* --- self-hosted IBM Plex (OFL 1.1, see fonts/OFL.txt) — no external requests --- */
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/IBMPlexSans-Regular.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/IBMPlexSans-SemiBold.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/IBMPlexMono-Regular.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/IBMPlexMono-Medium.woff2") format("woff2")}
:root{
--paper:#0b0c0e;--ink:#e9ebee;--mut:#8d939d;--dim:#5b6169;
--rule:rgba(255,255,255,.095);
--true:#f0873a;--true:oklch(0.72 0.17 45);
--sans:"IBM Plex Sans",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
--mono:"IBM Plex Mono",ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
--pad:clamp(18px,3.6vw,44px);
}
[data-theme="light"]{
--paper:#f6f5f2;--ink:#15171a;--mut:#5c616a;--dim:#8a8f98;
--rule:rgba(18,22,26,.14);
--true:#b35a18;--true:oklch(0.55 0.17 45);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:var(--pad)}
h1,p{margin:0}
@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
main{max-width:1200px;width:100%;border-left:1px solid var(--rule);border-right:1px solid var(--rule);padding:64px var(--pad)}
.mark{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.mark span.sq{width:6px;height:6px;background:var(--true);display:block}
h1{margin-top:26px;font-weight:600;font-size:clamp(3rem,9vw,5.5rem);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
p{margin-top:20px;max-width:56ch;color:var(--mut);font-size:17.5px;line-height:1.55;text-wrap:pretty}
a.back{margin-top:34px;display:inline-flex;align-items:center;gap:9px;background:transparent;color:var(--ink);font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:14px 20px;border:1px solid var(--rule);text-decoration:none}
a.back:hover{border-color:var(--ink)}
:focus-visible{outline:2px solid var(--true);outline-offset:2px}
</style>
</head>
<body>
<main>
<div class="mark"><span class="sq"></span><span>Error</span><span style="color:var(--rule)">/</span><span>404</span><span style="color:var(--rule)">/</span><span>Not found</span></div>
<h1>404<span style="color:var(--true);animation:blink 1.15s steps(1) infinite">_</span></h1>
<p>This page doesn't exist — a numerator with no denominator, if you will.</p>
<a class="back" href="/">← Back to Actuals</a>
</main>
</body>
</html>
